<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>YouTube Player</title>
    <style>
        html, body, #player {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #000;
        }
    </style>
</head>
<body>
    <div id="player"></div>
    <script>
        "use strict";

        var parentOrigin = window.location.origin;
        var videoId = new URLSearchParams(window.location.search).get("videoId");
        var player = null;
        var reportTimer = 0;
        var captionGuardTimer = 0;
        var captionRetryTimers = [];
        var initialReadySent = false;

        function notify(type, data) {
            window.parent.postMessage({ type: type, data: data }, parentOrigin);
        }

        function callPlayer(name, fallback) {
            try {
                return player && typeof player[name] === "function" ? player[name]() : fallback;
            } catch (_) {
                return fallback;
            }
        }

        function makePlayerVars() {
            return {
                controls: 1,
                enablejsapi: 1,
                modestbranding: 1,
                rel: 0,
                fs: 0,
                playsinline: 1,
                cc_load_policy: 0,
                iv_load_policy: 3,
                disablekb: 1,
                origin: parentOrigin,
                widget_referrer: window.location.href
            };
        }

        function forceCaptionsOff(target) {
            var current = target || player;
            if (!current) return;
            try {
                if (typeof current.unloadModule === "function") {
                    current.unloadModule("captions");
                } else if (typeof current.setOption === "function") {
                    current.setOption("captions", "track", {});
                }
            } catch (_) {}
        }

        function stopCaptionGuard() {
            captionRetryTimers.forEach(function (timer) {
                window.clearTimeout(timer);
            });
            captionRetryTimers = [];
            if (captionGuardTimer) {
                window.clearInterval(captionGuardTimer);
                captionGuardTimer = 0;
            }
        }

        function startCaptionGuard(target) {
            stopCaptionGuard();
            var guardedPlayer = target || player;
            forceCaptionsOff(guardedPlayer);
            [100, 500, 1500, 4000].forEach(function (delay) {
                captionRetryTimers.push(window.setTimeout(function () {
                    if (player === guardedPlayer) forceCaptionsOff(guardedPlayer);
                }, delay));
            });
            captionGuardTimer = window.setInterval(function () {
                if (player === guardedPlayer) forceCaptionsOff(guardedPlayer);
            }, 2000);
        }

        function startStatusTimer() {
            if (reportTimer) return;
            reportTimer = window.setInterval(function () {
                if (!player) return;
                window.parent.postMessage({
                    type: "youtubeStatus",
                    currentTime: callPlayer("getCurrentTime", 0),
                    volume: callPlayer("getVolume", 100),
                    isMuted: callPlayer("isMuted", false),
                    duration: callPlayer("getDuration", 0)
                }, parentOrigin);
            }, 500);
        }

        function onPlayerReady(event) {
            player = event.target;
            startCaptionGuard(player);
            if (!initialReadySent) {
                initialReadySent = true;
                notify("youtubePlayerReady");
            }
            startStatusTimer();
        }

        function createPlayer() {
            player = new YT.Player("player", {
                height: "100%",
                width: "100%",
                videoId: videoId,
                playerVars: makePlayerVars(),
                events: {
                    onReady: onPlayerReady,
                    onApiChange: function (event) {
                        forceCaptionsOff(event.target);
                    },
                    onStateChange: function (event) {
                        forceCaptionsOff(event.target);
                        if (event.data === YT.PlayerState.ENDED) {
                            stopCaptionGuard();
                        }
                        notify("youtubeStateChange", event.data);
                    },
                    onPlaybackQualityChange: function (event) {
                        notify("youtubePlaybackQualityChange", event.data);
                    },
                    onPlaybackRateChange: function (event) {
                        notify("youtubePlaybackRateChange", event.data);
                    },
                    onError: function (event) {
                        stopCaptionGuard();
                        notify("youtubeError", event.data);
                    }
                }
            });
        }

        window.onYouTubeIframeAPIReady = function () {
            if (!videoId) {
                notify("youtubeError", "missing-video-id");
                return;
            }
            createPlayer();
        };

        window.addEventListener("message", function (event) {
            if (event.origin !== parentOrigin || event.source !== window.parent) return;
            var message = event.data || {};
            if (message.type !== "youtubeCommand") return;
            var args = message.args || [];
            try {
                if (message.func === "loadModule" && args[0] === "captions") {
                    forceCaptionsOff(player);
                    return;
                }
                if (message.func === "setOption" && args[0] === "captions") {
                    forceCaptionsOff(player);
                    return;
                }
                if (message.func === "stopVideo") {
                    stopCaptionGuard();
                } else if (message.func === "playVideo") {
                    startCaptionGuard(player);
                }
                if (player && typeof player[message.func] === "function") {
                    player[message.func].apply(player, args);
                }
            } catch (_) {}
        });

        window.addEventListener("beforeunload", function () {
            if (reportTimer) window.clearInterval(reportTimer);
            stopCaptionGuard();
        });

        var apiScript = document.createElement("script");
        apiScript.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(apiScript);
    </script>
</body>
</html>
